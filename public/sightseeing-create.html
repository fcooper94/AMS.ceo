<!-- TITLE: Create Sightseeing Tour - AMS.ceo -->
<!-- SUBTITLE: Create Sightseeing Tour -->
<!-- SCRIPTS: /js/sightseeing-create.js -->

<style>
  .tour-layout { display: flex; gap: 1rem; align-items: stretch; flex-wrap: wrap; }
  .tour-map-col { flex: 1 1 520px; min-width: 320px; display: flex; flex-direction: column; }
  .tour-panel { flex: 0 0 360px; max-width: 100%; display: flex; flex-direction: column; gap: 0.75rem; }
  #tourMap { flex: 1; min-height: 62vh; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; z-index: 0; }
  .tour-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.4rem; }
  .tour-field label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); margin-bottom: 0.3rem; font-weight: 600; }
  .tour-field input, .tour-field select {
    width: 100%; padding: 0.55rem 0.6rem; background: var(--surface-elevated);
    border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); font-size: 0.9rem; outline: none;
  }
  .tour-stat { background: var(--surface-elevated); border: 1px solid var(--border-color); border-radius: 6px; padding: 0.6rem 0.7rem; }
  .tour-stat .k { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
  .tour-stat .v { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); }
  .wp-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.55rem; background: var(--surface-elevated); border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.8rem; }
  .wp-item .idx { width: 20px; height: 20px; border-radius: 50%; background: var(--accent-color); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; flex-shrink: 0; }
  .wp-item .rm { margin-left: auto; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 0 0.2rem; }
  .wp-item .rm:hover { color: #f85149; }
  .days-row { display: flex; gap: 0.3rem; flex-wrap: wrap; }
  .day-toggle { flex: 1; min-width: 38px; text-align: center; padding: 0.35rem 0; font-size: 0.72rem; font-weight: 600; border: 1px solid var(--border-color); border-radius: 5px; background: var(--surface-elevated); color: var(--text-secondary); cursor: pointer; user-select: none; }
  .day-toggle.on { background: var(--accent-color); border-color: var(--accent-color); color: #fff; }
</style>

<div class="dashboard-container">

  <main class="main-content">
    <div style="padding: 0.5rem 0 1rem;">
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.75rem;">
    <div>
      <h1 style="margin:0;font-size:1.3rem;">CREATE SIGHTSEEING TOUR</h1>
      <div class="tour-hint" style="margin-top:0.2rem;">Click the map to add scenic waypoints. The tour departs from and returns to your base airport.</div>
    </div>
    <div style="font-size:0.8rem;color:var(--text-secondary);">Base: <strong id="tourBaseLabel" style="color:var(--accent-color);">…</strong></div>
  </div>

  <div class="tour-layout">
    <div class="tour-map-col">
      <div id="tourMap"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:0.4rem;">
        <span class="tour-hint">Tip: click empty map to add a spot; click a waypoint marker to remove it.</span>
        <button id="clearWpBtn" class="btn btn-secondary" style="padding:0.3rem 0.75rem;font-size:0.75rem;">Clear waypoints</button>
      </div>
    </div>

    <div class="tour-panel">
      <div style="display:flex;gap:0.5rem;">
        <div class="tour-stat" style="flex:1;"><div class="k">Distance</div><div class="v"><span id="tourDist">0</span><span style="font-size:0.7rem;font-weight:400;"> nm</span></div></div>
        <div class="tour-stat" style="flex:1;"><div class="k">Duration</div><div class="v" id="tourDur">—</div></div>
      </div>

      <div class="tour-field">
        <label for="tourName">Tour Name</label>
        <input type="text" id="tourName" maxlength="100" placeholder="e.g. London Skyline Tour" />
      </div>

      <div class="tour-field">
        <label for="tourAircraft">Aircraft</label>
        <select id="tourAircraft"><option value="">Select an aircraft…</option></select>
        <div class="tour-hint" id="tourRangeHint"></div>
      </div>

      <div class="tour-field">
        <label for="tourPrice">Ticket Price (per seat)</label>
        <input type="number" id="tourPrice" min="0" step="1" placeholder="0" />
        <div class="tour-hint" id="tourPriceHint"></div>
      </div>

      <div class="tour-field">
        <label>Operating Days</label>
        <div class="days-row" id="tourDays"></div>
      </div>

      <div class="tour-field">
        <label for="tourTime">Departure Time (optional)</label>
        <input type="time" id="tourTime" />
      </div>

      <div class="tour-field">
        <label>Waypoints (<span id="wpCount">0</span>)</label>
        <div id="wpList" style="display:flex;flex-direction:column;gap:0.35rem;max-height:180px;overflow-y:auto;"></div>
      </div>

      <div id="tourError" style="display:none;color:#f85149;font-size:0.8rem;"></div>

      <div style="display:flex;gap:0.5rem;margin-top:0.25rem;">
        <button id="saveTourBtn" class="btn btn-primary" style="flex:1;padding:0.6rem;">Save Tour</button>
        <button id="cancelTourBtn" class="btn btn-secondary" style="flex:1;padding:0.6rem;">Cancel</button>
      </div>
    </div>
  </div>
    </div>
  </main>
</div>
