<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="AMS.ceo - Build and manage your airline empire with real-time operations, fleet management, route planning and competitive AI airlines.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0f1a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#1a4d8f" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AMS.ceo">
  <link rel="apple-touch-icon" href="/img/icon.svg">
  <title id="pageTitle">AMS.ceo - Airline Management Sim</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%230066cc'/%3E%3Ctext x='50' y='42' font-family='Arial, sans-serif' font-size='28' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'%3EAMS%3C/text%3E%3Ctext x='50' y='70' font-family='Arial, sans-serif' font-size='18' font-weight='600' fill='%2399ccff' text-anchor='middle' dominant-baseline='central'%3E.ceo%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/world-selection.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/theme-light.css">
  <script>
    // Apply saved theme before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body class="dashboard-body no-transition">
  <script>
    // Disable transitions on initial load to prevent slide-in effects
    setTimeout(function() { document.body.classList.remove('no-transition'); }, 50);

    // Hide navbar/sidebar immediately on public pages to prevent flash
    // Public header/footer are hidden by default, shown after auth check confirms unauthenticated
    (function() {
      var p = window.location.pathname;
      var pub = ['/contact', '/wiki', '/faqs', '/privacy', '/data-handling'];
      if (pub.indexOf(p) !== -1 && document.cookie.indexOf('connect.sid') === -1) {
        document.write('<style id="public-page-styles">.navbar,.sidebar{display:none!important}.main-content{margin-left:0!important;overflow-y:visible!important}.dashboard-container{height:auto!important;flex:1}.dashboard-body{height:auto!important;overflow:auto!important}#pageContent{display:flex;flex-direction:column;min-height:100vh}.public-page-header,.public-page-footer{display:none!important}</style>');
        document.documentElement.style.setProperty('--navbar-height', '0px');
      }
    })();
  </script>
  <!-- Admin impersonation banner (only shown while an admin is viewing as another user) -->
  <div id="impersonationBanner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:linear-gradient(180deg,#f59e0b,#d97706); border-bottom:1px solid rgba(0,0,0,0.22); box-shadow:0 2px 12px rgba(0,0,0,0.35); font-family:system-ui,-apple-system,sans-serif;">
    <div style="max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:0.8rem; padding:0.5rem 1rem;">
      <span style="display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; background:rgba(0,0,0,0.16); flex-shrink:0;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3a2600" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
      <span style="font-size:0.85rem; font-weight:500; color:rgba(26,18,0,0.72);">Viewing as <strong id="impersonationName" style="font-weight:700; color:#1a1200;">user</strong></span>
      <button onclick="stopImpersonation()" style="margin-left:0.3rem; background:#1a1200; color:#fde9c8; border:none; padding:0.35rem 0.85rem; border-radius:999px; cursor:pointer; font-size:0.78rem; font-weight:600; display:inline-flex; align-items:center; gap:0.35rem; transition:background 0.15s ease;" onmouseover="this.style.background='#000'" onmouseout="this.style.background='#1a1200'">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 5 5v3"/></svg>
        Return to admin
      </button>
    </div>
  </div>
  <script>
    (function(){
      fetch('/auth/status').then(function(r){ return r.json(); }).then(function(d){
        if (d && d.authenticated && d.impersonating) {
          var n = document.getElementById('impersonationName');
          if (n) n.textContent = (d.user && d.user.name) ? d.user.name : 'user';
          var b = document.getElementById('impersonationBanner');
          if (b) { b.style.display = 'block'; document.body.style.paddingTop = b.offsetHeight + 'px'; }
        }
      }).catch(function(){});
    })();
    function stopImpersonation(){
      fetch('/api/admin/stop-impersonation', { method:'POST', headers:{'Content-Type':'application/json'} })
        .then(function(r){ return r.json(); })
        .then(function(d){ if (d && d.success) { window.location.href = d.redirect; } else { alert((d && d.error) || 'Failed to return to admin'); } })
        .catch(function(){ alert('Network error'); });
    }
  </script>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-left">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <a href="/dashboard" class="nav-brand" style="margin-left: 0;">
          <div style="display: flex; flex-direction: column; align-items: flex-start;">
            <span class="brand-initials" style="margin-left: 0; display: inline-flex; align-items: baseline;">AMS<span style="color: var(--text-secondary); font-weight: 600; font-size: 0.65em;">.ceo</span></span>
            <div style="font-size: 0.45rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-top: 0.2rem; margin-left: 0;">Expand ◆ Explore ◆ Evolve</div>
          </div>
        </a>
      </div>
      <div class="nav-world-info" id="worldInfoContainer">
        <div class="wi-world">
          <svg class="wi-globe" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span id="worldName">--</span>
        </div>
        <div class="wi-sep"></div>
        <div class="wi-date-group">
          <span class="wi-date" id="worldDate">--/--/----</span>
          <span class="wi-time" id="worldTime">--:--</span>
          <span class="wi-day" id="worldDay">--</span>
        </div>
        <div class="wi-sep"></div>
        <div class="wi-balance" id="worldBalance">$--</div>
      </div>
      <div class="nav-user">
        <div class="nav-user-credits-wrapper">
          <div class="nav-user-credits" id="creditsToggle" title="Click to view outgoings" style="cursor: pointer;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            <span id="userCredits">--</span>
          </div>
          <!-- Credits Dropdown Panel -->
          <div id="creditsDropdown" class="credits-dropdown" style="display: none;">
            <div class="credits-dropdown-header">
              <span class="credits-dropdown-title">CREDIT OVERVIEW</span>
              <span class="credits-dropdown-balance" id="dropdownCreditsBalance">--</span>
            </div>
            <div class="credits-dropdown-body" id="creditsDropdownBody">
              <div class="credits-dropdown-loading">Loading...</div>
            </div>
            <div class="credits-dropdown-footer">
              <a href="/credits" class="credits-add-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="8" x2="12" y2="16"></line>
                  <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
                Add Credits
              </a>
            </div>
          </div>
        </div>
        <div class="nav-user-divider"></div>
        <div class="nav-user-profile">
          <svg class="nav-user-avatar" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M20 21a8 8 0 0 0-16 0"></path>
          </svg>
          <div class="nav-user-details">
            <span class="nav-user-name" id="userName">Loading...</span>
            <span class="nav-user-role">CEO</span>
          </div>
        </div>
        <a href="/auth/logout" class="nav-logout-btn" title="Sign Out">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Sign Out</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Mobile world info expand panel (shown on tap at 480px) -->
  <div class="wi-expand-panel" id="worldInfoPanel"></div>

  <div id="worldEndingBanner" class="world-ending-banner" style="display: none;">
    <span id="worldEndingMessage"></span>
  </div>

  <div id="freePeriodBanner" class="free-period-banner" style="display: none;">
    <span id="freePeriodMessage"></span>
  </div>

  <div id="lowCreditsBanner" class="low-credits-banner" style="display: none;">
    <span id="lowCreditsMessage"></span>
  </div>

  <div id="pageContent">
    <!-- Page-specific content will be inserted here -->
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/loading-quips.js"></script>
  <script src="/js/currency.js"></script>
  <script src="/js/layout.js"></script>

  <!-- Global footer — injected into .main-content by layout.js so it flows
       after page content and never overlaps. Placed here (after scripts) so
       renderPage's #pageContent regex cannot strip it. -->
  <div class="app-global-footer" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; padding: 0.4rem 1rem; border-top: 1px solid var(--border-color); background: var(--bg-primary); text-align: center; font-size: 0.72rem; color: var(--text-muted);">
    <div style="display: flex; align-items: center; justify-content: center; gap: 0.55rem; flex-wrap: wrap;">
      <a href="#" onclick="toggleTheme();return false;" data-theme-label style="color: var(--text-secondary); text-decoration: none;" onmouseover="this.style.color='var(--accent-color)'" onmouseout="this.style.color='var(--text-secondary)'">Light Mode</a>
      <span style="opacity: 0.5;">&middot;</span>
      <a href="/changelog" style="color: var(--text-secondary); text-decoration: none;" onmouseover="this.style.color='var(--accent-color)'" onmouseout="this.style.color='var(--text-secondary)'">Recent Changes</a>
      <span style="opacity: 0.5;">&middot;</span>
      <a href="/privacy" style="color: var(--text-secondary); text-decoration: none;" onmouseover="this.style.color='var(--accent-color)'" onmouseout="this.style.color='var(--text-secondary)'">Privacy Policy</a>
      <span style="opacity: 0.5;">&middot;</span>
      <a href="/data-handling" style="color: var(--text-secondary); text-decoration: none;" onmouseover="this.style.color='var(--accent-color)'" onmouseout="this.style.color='var(--text-secondary)'">Data Handling</a>
    </div>
  </div>
</body>
</html>
