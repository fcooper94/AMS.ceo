<!-- TITLE: Financial Reports - AMS.ceo -->
<!-- SUBTITLE: Financial Overview -->
<!-- SCRIPTS: /js/finances.js -->

<div class="dashboard-container">
  <main class="main-content">
    <div class="page-header" style="margin-bottom: 1rem;">
      <h1>FINANCIAL REPORTS</h1>
    </div>

    <!-- Summary — Weekly profit hero + supporting stats -->
    <div style="display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; margin-bottom: 1.25rem;">
      <!-- Hero: Weekly Profit -->
      <div id="heroProfit" style="padding: 1rem 1.25rem; background: var(--surface-elevated); border: 1px solid var(--border-color); border-radius: 8px; display: flex; align-items: center; gap: 1.5rem;">
        <div style="flex-shrink: 0;">
          <span style="font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Weekly Profit</span>
          <div id="statWeeklyProfit" style="font-size: 1.6rem; font-weight: 800; color: var(--success-color); line-height: 1.2;">$0</div>
          <div id="statWeeklyLabel" style="font-size: 0.65rem; color: var(--text-muted); margin-top: 0.15rem;"></div>
        </div>
        <div style="width: 1px; height: 2.5rem; background: var(--border-color); flex-shrink: 0;"></div>
        <!-- Weekly breakdown -->
        <div style="display: flex; gap: 1.25rem; flex-wrap: wrap; align-items: center;">
          <div><span style="font-size: 0.6rem; color: var(--text-muted);">Revenue</span><div id="statWkRevenue" style="font-size: 0.95rem; font-weight: 700; color: var(--success-color);">$0</div></div>
          <div><span style="font-size: 0.6rem; color: var(--text-muted);">Costs</span><div id="statWkCosts" style="font-size: 0.95rem; font-weight: 700; color: #f85149;">$0</div></div>
          <div><span style="font-size: 0.6rem; color: var(--text-muted);">Overhead</span><div id="statOverhead" style="font-size: 0.95rem; font-weight: 700; color: var(--warning-color);">$0</div></div>
        </div>
        <div style="width: 1px; height: 2.5rem; background: var(--border-color); flex-shrink: 0;"></div>
        <!-- All-time compact -->
        <div style="display: flex; gap: 1.25rem; flex-wrap: wrap; align-items: center;">
          <div><span style="font-size: 0.6rem; color: var(--text-muted);">Flights</span><div id="statFlights" style="font-size: 0.95rem; font-weight: 700; color: var(--text-primary);">0</div></div>
          <div><span style="font-size: 0.6rem; color: var(--text-muted);">Passengers</span><div id="statPax" style="font-size: 0.95rem; font-weight: 700; color: var(--text-primary);">0</div></div>
          <div><span style="font-size: 0.6rem; color: var(--text-muted);">All-time Rev</span><div id="statRevenue" style="font-size: 0.95rem; font-weight: 700; color: var(--text-secondary);">$0</div></div>
        </div>
      </div>
      <!-- Balance -->
      <div style="padding: 1rem 1.25rem; background: var(--surface-elevated); border: 1px solid var(--border-color); border-radius: 8px; display: flex; flex-direction: column; justify-content: center; text-align: right; min-width: 100px;">
        <span style="font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Balance</span>
        <div id="statBalance" style="font-size: 1.3rem; font-weight: 700; color: var(--accent-color);">$0</div>
      </div>
    </div>

    <!-- Weekly P&L Table -->
    <div class="ops-panel full-width" style="margin-bottom: 1.25rem;">
      <div class="panel-header" style="padding: 0.5rem 1rem; display: flex; align-items: center; justify-content: space-between;">
        <h2 style="font-size: 0.8rem; margin: 0;">WEEKLY BREAKDOWN</h2>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <button id="weekNext" style="background: var(--surface-elevated); border: 1px solid var(--border-color); color: var(--text-muted); cursor: pointer; padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; line-height: 1.2;" title="Newer weeks">&#9664; Newer</button>
          <span id="weekRange" style="font-size: 0.7rem; color: var(--text-muted);"></span>
          <button id="weekPrev" style="background: var(--surface-elevated); border: 1px solid var(--border-color); color: var(--text-muted); cursor: pointer; padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; line-height: 1.2;" title="Older weeks">Older &#9654;</button>
        </div>
      </div>
      <div class="panel-body" style="padding: 0; overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; font-size: 0.8rem;" id="weeklyTable">
          <thead id="weeklyHead"></thead>
          <tbody id="weeklyBody">
            <tr><td colspan="9" style="padding: 1.5rem; text-align: center; color: var(--text-secondary);">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Route Performance (tabbed) -->
    <div class="ops-panel full-width" style="margin-bottom: 1.25rem;">
      <div class="panel-header" style="padding: 0.5rem 1rem; display: flex; align-items: center; gap: 1rem;">
        <h2 style="font-size: 0.8rem; margin: 0;">ROUTE PERFORMANCE</h2>
        <div id="routePerfTabs" style="display: flex; gap: 0; margin-left: auto;">
          <button class="rp-tab rp-tab-active" data-tab="cityPair" onclick="switchRouteTab('cityPair')" style="padding: 0.25rem 0.75rem; font-size: 0.7rem; font-weight: 600; border: 1px solid var(--border-color); background: var(--accent-color); color: #fff; cursor: pointer; border-radius: 4px 0 0 4px;">City Pair</button>
          <button class="rp-tab" data-tab="allRoutes" onclick="switchRouteTab('allRoutes')" style="padding: 0.25rem 0.75rem; font-size: 0.7rem; font-weight: 600; border: 1px solid var(--border-color); border-left: none; background: var(--surface-elevated); color: var(--text-muted); cursor: pointer;">All Routes</button>
          <button class="rp-tab" data-tab="byAcType" onclick="switchRouteTab('byAcType')" style="padding: 0.25rem 0.75rem; font-size: 0.7rem; font-weight: 600; border: 1px solid var(--border-color); border-left: none; background: var(--surface-elevated); color: var(--text-muted); cursor: pointer; border-radius: 0 4px 4px 0;">By A/C Type</button>
        </div>
      </div>
      <div class="panel-body" style="padding: 0; overflow-x: auto;">
        <div id="routePerfContent">
          <div style="padding: 1.5rem; text-align: center; color: var(--text-secondary); font-size: 0.85rem;">Loading...</div>
        </div>
      </div>
    </div>

  </main>
</div>
