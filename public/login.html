<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0f1a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#1a4d8f" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AMS.ceo">
  <link rel="apple-touch-icon" href="/img/icon.svg">
  <title>Sign In · AMS.ceo</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/theme-light.css">
  <script>try{const t=localStorage.getItem('theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .auth-brand .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }
    .auth-brand .logo span { color: var(--accent-color); font-size: 0.6em; font-weight: 400; }
    .auth-brand .sub {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 0.25rem;
    }
    .auth-title { font-size: 1.1rem; color: var(--text-primary); font-weight: 600; margin-bottom: 1.25rem; text-align: center; }
    .field { margin-bottom: 0.9rem; }
    .field label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.35rem; }
    .lp-input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 0.9rem;
      box-sizing: border-box;
      transition: border-color 0.15s;
    }
    .lp-input:focus { outline: none; border-color: var(--accent-color); }
    .lp-input::placeholder { color: var(--text-muted); }
    .lp-btn {
      display: block;
      width: 100%;
      padding: 0.7rem 1rem;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
      letter-spacing: 0.3px;
      transition: background 0.15s, border-color 0.15s;
    }
    .lp-btn-primary { background: var(--primary-color); border: 1px solid var(--primary-color); color: #fff; }
    .lp-btn-primary:hover { background: var(--accent-color); border-color: var(--accent-color); }
    .lp-error {
      display: none;
      margin-bottom: 0.75rem;
      padding: 0.5rem 0.75rem;
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(220, 38, 38, 0.4);
      border-radius: 4px;
      color: #fca5a5;
      font-size: 0.8rem;
    }
    .lp-success {
      display: none;
      margin-bottom: 0.75rem;
      padding: 0.5rem 0.75rem;
      background: rgba(5, 150, 105, 0.15);
      border: 1px solid rgba(5, 150, 105, 0.4);
      border-radius: 4px;
      color: #6ee7b7;
      font-size: 0.8rem;
    }
    .auth-links { margin-top: 1.25rem; text-align: center; font-size: 0.82rem; color: var(--text-secondary); }
    .auth-links a { color: var(--accent-color); text-decoration: none; }
    .auth-links a:hover { text-decoration: underline; }
    .auth-links .row { margin-top: 0.5rem; }
    .link-btn { background: none; border: none; color: var(--accent-color); cursor: pointer; font-size: 0.82rem; padding: 0; }
    .link-btn:hover { text-decoration: underline; }
    #forgotBlock { display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color); }

    /* PIN popup overlay */
    .pin-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 9999;
      align-items: center; justify-content: center;
    }
    .pin-overlay.active { display: flex; }
    .pin-card {
      background: var(--surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 2rem;
      width: 320px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .pin-card h3 { color: var(--text-primary); margin: 0 0 0.25rem; font-size: 1rem; }
    .pin-card .pin-sub { color: var(--text-muted); font-size: 0.75rem; margin-bottom: 1.25rem; }
    .pin-digits {
      display: flex; gap: 0.6rem; justify-content: center; margin-bottom: 1.25rem;
    }
    .pin-digits input {
      width: 48px; height: 56px;
      text-align: center; font-size: 1.4rem; font-weight: 700;
      background: var(--surface); color: var(--text-primary);
      border: 1px solid var(--border-color); border-radius: 6px;
      outline: none; caret-color: var(--accent-color);
    }
    .pin-digits input:focus { border-color: var(--accent-color); box-shadow: 0 0 0 2px rgba(59,130,246,0.25); }
    .pin-error { color: #fca5a5; font-size: 0.8rem; margin-bottom: 0.75rem; min-height: 1.2em; }
    .pin-cancel { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; margin-top: 0.5rem; }
    .pin-cancel:hover { color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo">AMS<span>.ceo</span></div>
      <div class="sub">Airline Management Sim</div>
    </div>
    <div class="auth-title">Sign In</div>

    <div id="signinError" class="lp-error"></div>

    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" class="lp-input" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" class="lp-input" placeholder="Password" autocomplete="current-password">
    </div>
    <button class="lp-btn lp-btn-primary" onclick="localLogin()">Sign In</button>

    <div class="auth-links">
      <div><button type="button" class="link-btn" onclick="toggleForgot()">Forgot password?</button></div>
      <div class="row">Don't have an account? <a href="/register">Register</a></div>
      <div class="row"><a href="/">&larr; Back</a></div>
      <div class="row"><a href="#" id="themeToggle" onclick="var t=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',t);localStorage.setItem('theme',t);this.textContent=t==='light'?'Dark Mode':'Light Mode';return false;"></a><script>document.getElementById('themeToggle').textContent=document.documentElement.getAttribute('data-theme')==='light'?'Dark Mode':'Light Mode';</script></div>
    </div>

    <div id="forgotBlock">
      <div id="forgotError" class="lp-error"></div>
      <div id="forgotSuccess" class="lp-success"></div>
      <div class="field">
        <label for="forgotEmail">Reset link — enter your email</label>
        <input type="email" id="forgotEmail" class="lp-input" placeholder="you@example.com">
      </div>
      <button id="forgotBtn" class="lp-btn lp-btn-primary" onclick="requestPasswordReset()">Send Reset Link</button>
    </div>
  </div>

  <!-- 2FA popup (shown only when user has opted into login-time 2FA) -->
  <div class="pin-overlay" id="tfaOverlay">
    <div class="pin-card">
      <h3>Two-Factor Authentication</h3>
      <div class="pin-sub">Enter the 6-digit code from your authenticator app</div>
      <div style="margin: 1rem 0;">
        <input type="text" id="tfaCode" class="lp-input" placeholder="000000" maxlength="6" autocomplete="off" inputmode="numeric" style="text-align: center; letter-spacing: 6px; font-family: 'Courier New', monospace; font-size: 1.3rem;">
      </div>
      <div class="pin-error" id="tfaError"></div>
      <button class="lp-btn lp-btn-primary" id="tfaSubmitBtn" onclick="submitTfa()">Verify</button>
      <button class="pin-cancel" onclick="closeTfa()">Cancel</button>
      <div style="margin-top: 0.75rem; font-size: 0.75rem; color: var(--text-muted, #6b7280);">You can also use a backup code</div>
    </div>
  </div>

  <!-- PIN popup -->
  <div class="pin-overlay" id="pinOverlay">
    <div class="pin-card">
      <h3>Support Login</h3>
      <div class="pin-sub">Enter your 4-digit PIN</div>
      <div class="pin-digits">
        <input type="tel" maxlength="1" inputmode="numeric" class="pin-digit" data-idx="0" autocomplete="off">
        <input type="tel" maxlength="1" inputmode="numeric" class="pin-digit" data-idx="1" autocomplete="off">
        <input type="tel" maxlength="1" inputmode="numeric" class="pin-digit" data-idx="2" autocomplete="off">
        <input type="tel" maxlength="1" inputmode="numeric" class="pin-digit" data-idx="3" autocomplete="off">
      </div>
      <div class="pin-error" id="pinError"></div>
      <button class="lp-btn lp-btn-primary" id="pinSubmitBtn" onclick="submitPin()">Verify</button>
      <button class="pin-cancel" onclick="closePin()">Cancel</button>
    </div>
  </div>

  <script>
    function localLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('signinError');
      errorDiv.style.display = 'none';

      if (!email || !password) {
        errorDiv.textContent = 'Email and password are required';
        errorDiv.style.display = 'block';
        return;
      }

      fetch('/auth/local-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      })
        .then(res => res.json())
        .then(data => {
          if (data.success && data.requires2fa) {
            document.getElementById('tfaOverlay').style.display = 'flex';
            document.getElementById('tfaCode').value = '';
            document.getElementById('tfaError').textContent = '';
            setTimeout(function () { document.getElementById('tfaCode').focus(); }, 100);
          } else if (data.success) {
            window.location.href = data.redirect;
          } else {
            errorDiv.textContent = data.error || 'Login failed';
            errorDiv.style.display = 'block';
          }
        })
        .catch(err => {
          errorDiv.textContent = 'Login failed: ' + err.message;
          errorDiv.style.display = 'block';
        });
    }

    function submitTfa() {
      var code = document.getElementById('tfaCode').value.trim();
      var errorDiv = document.getElementById('tfaError');
      var btn = document.getElementById('tfaSubmitBtn');
      errorDiv.textContent = '';
      if (!code) { errorDiv.textContent = 'Enter a code'; return; }
      btn.disabled = true; btn.textContent = 'Verifying...';
      fetch('/auth/verify-2fa', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.success) { window.location.href = data.redirect; }
          else { errorDiv.textContent = data.error || 'Invalid code'; btn.disabled = false; btn.textContent = 'Verify'; }
        })
        .catch(function () { errorDiv.textContent = 'Verification failed'; btn.disabled = false; btn.textContent = 'Verify'; });
    }

    function closeTfa() { document.getElementById('tfaOverlay').style.display = 'none'; }

    function toggleForgot() {
      const block = document.getElementById('forgotBlock');
      const open = block.style.display === 'block';
      block.style.display = open ? 'none' : 'block';
      if (!open) document.getElementById('forgotEmail').focus();
    }

    function requestPasswordReset() {
      const email = document.getElementById('forgotEmail').value.trim();
      const errorDiv = document.getElementById('forgotError');
      const successDiv = document.getElementById('forgotSuccess');
      const btn = document.getElementById('forgotBtn');
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      if (!email) {
        errorDiv.textContent = 'Please enter your email address';
        errorDiv.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';

      fetch('/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      })
        .then(res => res.json().then(data => ({ ok: res.ok, data })))
        .then(({ ok, data }) => {
          if (ok) {
            successDiv.textContent = data.message || 'If an account with that email exists, a reset link has been sent.';
            successDiv.style.display = 'block';
            btn.textContent = 'Sent!';
          } else {
            errorDiv.textContent = data.error || 'Something went wrong';
            errorDiv.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Send Reset Link';
          }
        })
        .catch(() => {
          errorDiv.textContent = 'Network error. Please try again.';
          errorDiv.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Send Reset Link';
        });
    }

    document.getElementById('loginPassword').addEventListener('keydown', e => {
      if (e.key === 'Enter') localLogin();
    });

    document.getElementById('tfaCode').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitTfa();
    });

    // ── PIN popup for support@ams.ceo ──
    const pinOverlay = document.getElementById('pinOverlay');
    const pinDigits = document.querySelectorAll('.pin-digit');
    const pinError = document.getElementById('pinError');

    document.getElementById('loginEmail').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const email = e.target.value.trim().toLowerCase();
        if (email === 'support@ams.ceo') { e.preventDefault(); openPin(); }
        else document.getElementById('loginPassword').focus();
      }
    });

    var pinVerified = false;
    document.getElementById('loginEmail').addEventListener('blur', () => {
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      if (email === 'support@ams.ceo' && !pinVerified) openPin();
    });

    function openPin() {
      pinError.textContent = '';
      pinDigits.forEach(d => { d.value = ''; });
      pinOverlay.classList.add('active');
      setTimeout(() => pinDigits[0].focus(), 50);
    }

    function closePin() {
      pinOverlay.classList.remove('active');
      document.getElementById('loginEmail').focus();
    }

    // Auto-advance digits, handle backspace, paste
    pinDigits.forEach((input, i) => {
      input.addEventListener('input', () => {
        input.value = input.value.replace(/\D/g, '').slice(-1);
        if (input.value && i < 3) pinDigits[i + 1].focus();
        if (i === 3 && input.value) submitPin();
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !input.value && i > 0) pinDigits[i - 1].focus();
        if (e.key === 'Enter') submitPin();
        if (e.key === 'Escape') closePin();
      });
      input.addEventListener('paste', e => {
        e.preventDefault();
        const paste = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4);
        paste.split('').forEach((ch, j) => { if (pinDigits[j]) pinDigits[j].value = ch; });
        if (paste.length === 4) submitPin();
        else if (paste.length > 0) pinDigits[Math.min(paste.length, 3)].focus();
      });
    });

    function submitPin() {
      const pin = Array.from(pinDigits).map(d => d.value).join('');
      if (pin.length < 4) { pinError.textContent = 'Enter all 4 digits'; return; }
      pinError.textContent = '';
      const btn = document.getElementById('pinSubmitBtn');
      btn.disabled = true; btn.textContent = 'Verifying...';

      fetch('/auth/local-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: 'support@ams.ceo', password: pin })
      })
        .then(res => res.json())
        .then(data => {
          if (data.success && data.requires2fa) {
            pinVerified = true;
            closePin();
            document.getElementById('tfaOverlay').style.display = 'flex';
            document.getElementById('tfaCode').value = '';
            document.getElementById('tfaError').textContent = '';
            setTimeout(function () { document.getElementById('tfaCode').focus(); }, 100);
          } else if (data.success) {
            window.location.href = data.redirect;
          } else {
            pinError.textContent = data.error || 'Invalid PIN';
            btn.disabled = false; btn.textContent = 'Verify';
            pinDigits.forEach(d => { d.value = ''; });
            pinDigits[0].focus();
          }
        })
        .catch(() => {
          pinError.textContent = 'Network error';
          btn.disabled = false; btn.textContent = 'Verify';
        });
    }

    // Close overlay when clicking outside the card
    pinOverlay.addEventListener('click', e => { if (e.target === pinOverlay) closePin(); });
  </script>
</body>
</html>
