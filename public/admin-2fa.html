<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Verification — AMS.ceo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1220;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .card {
      background: #111a2b;
      border: 1px solid #223049;
      border-radius: 10px;
      padding: 2rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .lock {
      width: 52px; height: 52px;
      margin: 0 auto 1rem;
      border-radius: 12px;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
    h1 { font-size: 1.1rem; margin-bottom: 0.35rem; }
    p.sub { color: #8b98ab; font-size: 0.85rem; line-height: 1.5; margin-bottom: 1.25rem; }
    input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      background: #0b1220;
      border: 1px solid #223049;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 1.15rem;
      text-align: center;
      letter-spacing: 0.35em;
      outline: none;
      margin-bottom: 0.75rem;
    }
    input:focus { border-color: #3b82f6; }
    button {
      width: 100%;
      padding: 0.7rem;
      background: #2b5fb8;
      border: 1px solid #3b82f6;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #3b82f6; }
    button:disabled { opacity: 0.5; cursor: default; }
    .err {
      display: none;
      color: #f85149;
      font-size: 0.8rem;
      margin-bottom: 0.75rem;
    }
    .hint { color: #5c6a80; font-size: 0.72rem; margin-top: 1rem; line-height: 1.5; }
    a { color: #3b82f6; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="lock">&#128274;</div>
    <h1>Admin Verification</h1>
    <p class="sub">Enter the 6-digit code from your authenticator app to access the admin panel.</p>
    <div id="err" class="err"></div>
    <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="000000" autofocus>
    <button id="verifyBtn">Verify</button>
    <div class="hint">Lost your device? Enter one of your backup codes instead.<br><a href="/dashboard">&larr; Back to dashboard</a></div>
  </div>
  <script>
    const codeEl = document.getElementById('code');
    const btn = document.getElementById('verifyBtn');
    const err = document.getElementById('err');

    async function verify() {
      const code = codeEl.value.trim();
      if (!code) return;
      btn.disabled = true;
      err.style.display = 'none';
      try {
        const r = await fetch('/api/admin/2fa/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const d = await r.json();
        if (r.ok && d.success) {
          window.location.href = '/admin';
          return;
        }
        err.textContent = d.error || 'That code is incorrect — try again.';
        err.style.display = 'block';
        codeEl.value = '';
        codeEl.focus();
      } catch (e) {
        err.textContent = 'Verification failed — check your connection and try again.';
        err.style.display = 'block';
      }
      btn.disabled = false;
    }

    btn.addEventListener('click', verify);
    codeEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') verify(); });
  </script>
</body>
</html>
